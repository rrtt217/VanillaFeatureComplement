[Features]
EnableMapZoomout=1
EnableMapClone=1
EnableEndPlatformGeneration=1
EnableElytraPoweredFlight=1
EnableSleepClearWeather=1
EnableShield=1
EnablePlayerKilledXpDropFix=1
EnableStructureLocate=1
EnableVillageLoot=1
; Cuberite's village generation places blocks only and never spawns a villager, so the
; plugin populates each village it can confirm. PerVillage is the population target;
; PerTick caps how many queued origins are handled per tick, since the work is deferred
; off the chunk-available hook onto the world tick.
EnableVillageVillagers=1
VillageVillagersPerVillage=6
VillageVillagersPerTick=2

[Debug]
; Verbose per-event diagnostics: every item use, every damage event, every
; shield raise/release and elytra fallback notice. Off by default.
EnableDebugLog=0

